mode: 0755
path: "/usr/local/bin/pcsd-auth.sh"
contents:
  inline: |
    #!/bin/bash

    # Timeout after 5 minutes (adjust if needed)
    MAX_WAIT_SECONDS=300
    SLEEP_INTERVAL=5
    elapsed=0

    while true; do
      # Get node names
      mapfile -t nodes < <(oc get nodes --no-headers 2>/dev/null | awk '{print $1}')
  
      if [[ ${#nodes[@]} -ge 2 ]]; then
        break
      fi

      if (( elapsed >= MAX_WAIT_SECONDS )); then
        echo "Timeout waiting for 2 nodes. Only ${#nodes[@]} found."
        exit 1
      fi

      sleep $SLEEP_INTERVAL
      (( elapsed += SLEEP_INTERVAL ))
    done

    # Assign variables
    NodeName1=${nodes[0]}
    NodeName2=${nodes[1]}

    # Get IPs
    NodeIP1=$(oc get node "$NodeName1" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')
    NodeIP2=$(oc get node "$NodeName2" -o jsonpath='{.status.addresses[?(@.type=="InternalIP")].address}')


    /usr/sbin/pcs host auth "$NodeName1" addr="$NodeIP1" "$NodeName2" addr="$NodeIP2" --token /var/lib/pcsd/token --debug