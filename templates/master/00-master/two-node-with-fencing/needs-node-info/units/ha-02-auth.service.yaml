name: ha-02-auth.service
enabled: true
contents: |
  [Unit]
  Description=Auth nodes
  After=ha-01-enable-services.service
  Wants=pcsd.service

  [Service]
  Type=oneshot
  ExecStart=/bin/bash -c "/usr/sbin/pcs pcsd accept_token /var/lib/pcsd/token"
  ExecStartPost=/bin/bash -c "/usr/sbin/pcs host auth {{(index .CtrlPlaneNodes 0).Hostname}} addr={{(index .CtrlPlaneNodes 0).InternalIP}} {{(index .CtrlPlaneNodes 1).Hostname}} addr=={{(index .CtrlPlaneNodes 1).InternalIP}} --token /var/lib/pcsd/token --debug" RemainAfterExit=yes
  Restart=on-failure
  RestartSec=10
  StartLimitBurst=3

  [Install]
  WantedBy=multi-user.target
